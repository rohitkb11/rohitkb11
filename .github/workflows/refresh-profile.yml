name: Refresh profile graphics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
  push:
    paths:
      - 'scripts/refresh.py'
      - '.github/workflows/refresh-profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-graphics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate public profile graphics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh.py
      - name: Commit refreshed graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile graphics'
            git push
          fi
